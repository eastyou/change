[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "change"
version = "0.1.0"
description = "购物找零：商品总价、付款、找零与硬币拆分练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "money", "math", "shopping", "worksheet", "printable"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
change = "change.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/change"
Source = "https://github.com/eastyou/change"

[tool.setuptools]
packages = ["change"]
